<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SonicMF - The Ultimate Audio Architect</title>
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SonicMF" />
    <link rel="apple-touch-icon" href="https://unpkg.com/lucide-static@latest/icons/music-2.svg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000; /* Pure Black */
        color: #f5f5f5;
        background-image: radial-gradient(circle at 50% 0%, #2e1065 0%, #000000 40%);
        background-attachment: fixed;
        overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #581c87; /* Purple 900 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #7e22ce; /* Purple 700 */
      }
      .animate-wave-slow {
        animation: wave 1.5s ease-in-out infinite;
      }
      .animate-wave-fast {
        animation: wave 0.8s ease-in-out infinite;
      }
      @keyframes wave {
        0%, 100% { height: 20%; }
        50% { height: 100%; }
      }
      .glass-panel {
        background: rgba(10, 10, 10, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(139, 92, 246, 0.15);
      }
    </style>
